<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Califica tu experiencia</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="card">
    <div class="badge">Tu opinión importa</div>

    <h1 id="businessName">¿Cómo fue tu experiencia?</h1>
    <p class="subtitle">Ayúdanos con una calificación rápida</p>

    <div class="stars" id="stars">
      <span class="star" data-value="1">★</span>
      <span class="star" data-value="2">★</span>
      <span class="star" data-value="3">★</span>
      <span class="star" data-value="4">★</span>
      <span class="star" data-value="5">★</span>
    </div>

    <p id="ratingText" class="rating-text">Selecciona una cantidad de estrellas</p>

    <div id="form" class="hidden">
      <h3>Cuéntanos qué pasó</h3>
      <textarea id="comment" placeholder="Escribe aquí tu comentario..."></textarea>
      <button id="sendBtn">Enviar comentario</button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
