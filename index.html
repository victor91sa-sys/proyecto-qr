<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Califica tu experiencia</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="background-overlay"></div>

  <main class="page">
    <section class="card">
      <img id="logo" class="logo" src="" alt="Logo del negocio" />

      <p class="eyebrow">Queremos escucharte</p>
      <h1 id="businessName">Tu experiencia es importante</h1>
      <p id="businessMessage" class="message">
        Gracias por visitarnos. Tu opinión nos ayuda a mejorar.
      </p>

      <div class="stars" aria-label="Calificación">
        <button type="button" onclick="rate(1)">⭐</button>
        <button type="button" onclick="rate(2)">⭐</button>
        <button type="button" onclick="rate(3)">⭐</button>
        <button type="button" onclick="rate(4)">⭐</button>
        <button type="button" onclick="rate(5)">⭐</button>
      </div>

      <p class="hint">Selecciona una calificación del 1 al 5</p>

      <div id="form" class="feedback-box hidden">
        <h3>Cuéntanos qué pasó</h3>
        <textarea id="comment" placeholder="Escribe aquí tu comentario..."></textarea>
        <button id="sendBtn" class="primary-btn" onclick="sendFeedback()">
          Enviar comentario
        </button>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
